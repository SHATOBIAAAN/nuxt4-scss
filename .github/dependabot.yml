# Обновления приходят пачкой раз в неделю: минорные и патчи одним PR, мажорные —
# отдельно, потому что их читают по changelog. CI на PR проверяет всё то же, что и на main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Типы Node идут за рантаймом из .node-version: мажор поднимают вместе с Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 — нативный компилятор без JS API, vue-tsc на нём не запускается.
      # Правило снимают, когда vue-tsc объявит поддержку 7.x.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
